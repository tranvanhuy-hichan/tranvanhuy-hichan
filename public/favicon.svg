<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <filter id="symShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#022456" flood-opacity="0.32" />
    </filter>
  </defs>
  
  <!-- Base Squircle -->
  <rect x="0" y="0" width="512" height="512" rx="132" fill="url(#bg)" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="130.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" />

  <!-- Code Brackets & Slash -->
  <g filter="url(#symShadow)" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Chevron < -->
    <path d="M 194 164 L 114 256 L 194 348" />
    <!-- Forward Slash / -->
    <line x1="226" y1="360" x2="286" y2="152" stroke="url(#slashGrad)" stroke-width="50" />
    <!-- Right Chevron > -->
    <path d="M 318 164 L 398 256 L 318 348" />
  </g>
</svg>